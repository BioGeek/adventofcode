[project]
name = "adventofcode"
version = "0.0.1"
authors = [
  { name="Jeroen Van Goey", email="jeroen.vangoey@gmail.com" },
]
description = "My solutions to Advent of Code"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[project.urls]
"Homepage" = "https://github.com/BioGeek/adventofcode"

[build-system]
requires = ["setuptools>=65.6.3"]
build-backend = "setuptools.build_meta"


[tool.isort]
profile = "black"
src_paths = ["2017", "2018", "2019", "2020", "2021", "noxfile.py"]

[tool.black]
target_version = ['py310']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to this repository
  | 2017
  | 2018
)/
'''

[tool.mypy]
python_version = '3.13'

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "flake8-isort>=7.0.0",
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "nox>=2025.11.12",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-timeout>=2.4.0",
]
